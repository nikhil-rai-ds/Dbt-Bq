models:
  - name: dim_location
    description: "Table contains information about pick up and drop locations"
    columns:
      - name: location_id
        description: "Unique id of each location"
        tests:
          - unique
          - not_null

  - name: dim_vendor
    description: "Table contains information about the vendors"
    columns:
      - name: vendor_id
        description: "Unique id of each vendor"
        tests:
          - unique
          - not_null

  - name: fct_tripdata
    columns:
      - name: passenger_count
        description: count_of_passenger
        tests:
          - is_even
          - is_not_zero

  - name: reporting_feature
    description: "This checks if the passenger was generous or not"
    tests:
      - dbt_utils.equality:
          arguments:
            compare_model: ref('reporting_data_feature_expected') 

  - name : report
    columns : 
      # identifiers
      - name: vendor_id
        data_type: int64
        description: "Vendor identifier"

      - name: rate_code_id
        data_type: int64
        description: "Rate code for the trip"

      - name: pickup_location_id
        data_type: int64

      - name: dropoff_location_id
        data_type: int64

      # timestamps
      - name: pickup_datetime
        data_type: timestamp

      - name: dropoff_datetime
        data_type: timestamp

      # trip info


      - name: passenger_count
        data_type: int64


      - name: trip_type
        data_type: int64

      # payment info
      - name: fare_amount
        data_type: numeric

      - name: extra
        data_type: numeric

      - name: mta_tax
        data_type: numeric

      - name: tip_amount
        data_type: numeric

      - name: tolls_amount
        data_type: numeric

      - name: ehail_fee
        data_type: numeric

      - name: improvement_surcharge
        data_type: numeric

      - name: total_amount
        data_type: numeric

      - name: payment_type
        data_type: int64
      
      - name: trip_id 
        data_type: string

      - name : payment_name 
        data_type:  string 
      
      - name : taxi_type 
        data_type:  string 
             
